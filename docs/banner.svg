<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-labelledby="title desc">
  <title id="title">lumaprints</title>
  <desc id="desc">The Lumaprints print-on-demand API, built for AI agents. MCP server, JSON CLI, typed SDK, and local GUI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0c10"/>
      <stop offset="1" stop-color="#161220"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59f00"/>
      <stop offset=".45" stop-color="#e8590c"/>
      <stop offset="1" stop-color="#be4bdb"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59f00"/>
      <stop offset=".5" stop-color="#e8590c"/>
      <stop offset="1" stop-color="#ae3ec9"/>
    </linearGradient>
    <radialGradient id="glowA"><stop offset="0" stop-color="#e8590c" stop-opacity=".42"/><stop offset="1" stop-color="#e8590c" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0" stop-color="#ae3ec9" stop-opacity=".38"/><stop offset="1" stop-color="#ae3ec9" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowC"><stop offset="0" stop-color="#1c7ed6" stop-opacity=".34"/><stop offset="1" stop-color="#1c7ed6" stop-opacity="0"/></radialGradient>
    <clipPath id="card"><rect width="1280" height="440" rx="24"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; white-space: pre; }
      .k { fill: #ffa657; } .s { fill: #a5d6ff; } .n { fill: #79c0ff; } .b { fill: #d2a8ff; } .p { fill: #c9d1d9; } .g { fill: #7ee787; } .m { fill: #8b8b98; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="440" fill="url(#bg)"/>
    <circle cx="150" cy="470" r="330" fill="url(#glowA)"/>
    <circle cx="640" cy="-40" r="300" fill="url(#glowB)"/>
    <circle cx="1230" cy="470" r="340" fill="url(#glowC)"/>
    <g opacity=".07" stroke="#fff">
      <path d="M0 110H1280M0 220H1280M0 330H1280M160 0V440M320 0V440M480 0V440M640 0V440M800 0V440M960 0V440M1120 0V440"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="1279" height="439" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <g class="sans">
    <circle cx="96" cy="102" r="22" fill="url(#logo)"/>
    <circle cx="89" cy="95" r="7" fill="#fff" fill-opacity=".28"/>
    <text x="134" y="120" font-size="50" font-weight="700" fill="#f4f4f7" letter-spacing="-1.5">lumaprints</text>
    <text x="74" y="160" font-size="15" fill="#8b8b98" letter-spacing=".4">UNOFFICIAL &#183; MIT &#183; ZERO DEPENDENCIES</text>

    <text x="72" y="222" font-size="33" font-weight="600" fill="#e9e9ef" letter-spacing="-.6">The Lumaprints print-on-demand API,</text>
    <text x="72" y="264" font-size="33" font-weight="600" fill="url(#ink)" letter-spacing="-.6">built for AI agents.</text>

    <g font-size="15" font-weight="600" fill="#e9e9ef" text-anchor="middle">
      <rect x="72" y="306" width="124" height="36" rx="18" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/>
      <text x="134" y="329">MCP server</text>
      <rect x="206" y="306" width="104" height="36" rx="18" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/>
      <text x="258" y="329">JSON CLI</text>
      <rect x="320" y="306" width="114" height="36" rx="18" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/>
      <text x="377" y="329">Typed SDK</text>
      <rect x="444" y="306" width="112" height="36" rx="18" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/>
      <text x="500" y="329">Local GUI</text>
    </g>
    <text x="74" y="384" font-size="15" fill="#8b8b98">Sandbox by default &#183; previews before every order &#183; no surprise charges</text>
  </g>

  <g>
    <rect x="700" y="48" width="516" height="344" rx="14" fill="#101015" fill-opacity=".92" stroke="#ffffff" stroke-opacity=".12"/>
    <circle cx="724" cy="70" r="6" fill="#ff5f57"/>
    <circle cx="744" cy="70" r="6" fill="#febc2e"/>
    <circle cx="764" cy="70" r="6" fill="#28c840"/>
    <text x="958" y="75" class="sans m" font-size="13" text-anchor="middle">agent shell</text>
    <line x1="700" y1="92" x2="1216" y2="92" stroke="#ffffff" stroke-opacity=".08"/>

    <g class="mono" font-size="14.5" xml:space="preserve">
      <text x="722" y="122"><tspan class="g">$</tspan><tspan class="p"> npx lumaprints submit-order --input @order.json</tspan></text>
      <text x="722" y="146" class="p">{</text>
      <text x="739" y="168"><tspan class="k">"submitted"</tspan><tspan class="p">: </tspan><tspan class="b">false</tspan><tspan class="p">,</tspan></text>
      <text x="739" y="190"><tspan class="k">"environment"</tspan><tspan class="p">: </tspan><tspan class="s">"sandbox"</tspan><tspan class="p">,</tspan></text>
      <text x="739" y="212"><tspan class="k">"estimate"</tspan><tspan class="p">: {</tspan></text>
      <text x="757" y="234"><tspan class="k">"productSubtotal"</tspan><tspan class="p">: </tspan><tspan class="n">84</tspan><tspan class="p">,</tspan></text>
      <text x="757" y="256"><tspan class="k">"shipping"</tspan><tspan class="p">: </tspan><tspan class="n">11.59</tspan><tspan class="p">,</tspan></text>
      <text x="757" y="278"><tspan class="k">"estimatedTotalBeforeTax"</tspan><tspan class="p">: </tspan><tspan class="n">95.59</tspan></text>
      <text x="739" y="300" class="p">},</text>
      <text x="739" y="322"><tspan class="k">"nextStep"</tspan><tspan class="p">: </tspan><tspan class="s">"Show the user, then confirm: true"</tspan></text>
      <text x="722" y="344" class="p">}</text>
      <text x="722" y="370"><tspan class="g">$</tspan></text>
    </g>
    <rect x="738" y="357" width="9" height="17" fill="#c9d1d9">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
